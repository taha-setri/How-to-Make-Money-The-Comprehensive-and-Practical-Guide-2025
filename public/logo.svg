<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 140" width="560" height="140" fill="none">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Emerald Growth Gradient -->
    <linearGradient id="emeraldGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Text Shimmer Gradient -->
    <linearGradient id="textGradAr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadowFilter" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Left/Icon Side: Hexagonal Luxury Shield Emblem (Center 70, 70) -->
  <g transform="translate(10, 10)">
    <!-- Outer Glow -->
    <path d="M60 6 L108 34 L108 86 L60 114 L12 86 L12 34 Z" 
          fill="none" stroke="url(#emeraldGradient)" stroke-width="4" opacity="0.4" filter="url(#softGlow)" />

    <!-- Main Shield Hexagon -->
    <path d="M60 8 L106 35 L106 85 L60 112 L14 85 L14 35 Z" 
          fill="url(#shieldGrad)" stroke="url(#goldGradient)" stroke-width="2.5" filter="url(#shadowFilter)" />

    <!-- Inner Path Arc: The Golden Rising Trajectory (مسار النمو) -->
    <path d="M26 80 Q 50 82, 60 52 T 94 30" 
          fill="none" stroke="url(#emeraldGradient)" stroke-width="5" stroke-linecap="round" />
    
    <!-- Dynamic Arrow Head -->
    <polygon points="94,22 102,30 90,36" fill="#34d399" />

    <!-- Stylized Coin Center -->
    <circle cx="60" cy="60" r="22" fill="#022c22" stroke="url(#goldGradient)" stroke-width="2.5" />
    
    <!-- Stylized 'M' / Currency Mark in Coin -->
    <path d="M50 70 L50 50 L60 62 L70 50 L70 70" 
          fill="none" stroke="url(#goldGradient)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Sparkles -->
    <polygon points="94,48 97,42 104,45 98,50" fill="#fef08a" />
    <polygon points="26,40 28,34 35,37 30,42" fill="#34d399" />
  </g>

  <!-- Right/Text Side: Platform Name and Identity (RTL / Arabic Primary) -->
  <g transform="translate(145, 0)">
    <!-- Primary Platform Name in Arabic -->
    <text x="0" y="68" font-family="system-ui, -apple-system, 'Cairo', 'Segoe UI', Tahoma, sans-serif" font-size="38" font-weight="900" fill="url(#textGradAr)" letter-spacing="0">
      مسار <tspan fill="url(#goldTextGrad)">المال</tspan>
    </text>

    <!-- English Brand & Subtitle -->
    <text x="2" y="98" font-family="system-ui, -apple-system, 'Inter', 'Cairo', sans-serif" font-size="13" font-weight="700" fill="#94a3b8" letter-spacing="1">
      MONEYPATH <tspan fill="#10b981">•</tspan> الدليل العملي للربح والعمل الحر
    </text>

    <!-- Trust Pill Badge -->
    <g transform="translate(0, 108)">
      <rect width="185" height="20" rx="10" fill="#064e3b" fill-opacity="0.6" stroke="#059669" stroke-width="0.8" />
      <text x="92" y="14" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#34d399">
        ✓ 100% موثوق ومجاني بالكامل
      </text>
    </g>
  </g>
</svg>
